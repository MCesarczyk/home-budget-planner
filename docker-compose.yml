services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hbp
      POSTGRES_USER: hbp
      POSTGRES_PASSWORD: hbp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbp -d hbp"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8088:8000"
    environment:
      POSTGRES_DB: hbp
      POSTGRES_USER: hbp
      POSTGRES_PASSWORD: hbp
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ALLOWED_HOSTS: web,localhost,127.0.0.1
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://web:8000
    depends_on:
      - web

volumes:
  pgdata:
