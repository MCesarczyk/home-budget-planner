[project]
name = "hbp"
version = "0.1.0"
description = "Home Budget Planner based on Django framework"
authors = [
    {name = "MCesarczyk",email = "michal.cesarczyk@gmail.com"}
]
license = "GNU GPLv3"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "djangorestframework (>=3.16,<4.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "drf-spectacular-sidecar (>=2026.7.1,<2027.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14,<0.15)"
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "DJ"]
