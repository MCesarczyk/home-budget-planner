# Production: the Django app only. The database is EXTERNAL (managed/production
# Postgres) — there is no `db` service here. All secrets and connection details
# come from .env.prod (see .env.prod.example); nothing is hardcoded.
#
#   cp .env.prod.example .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  web:
    build: .
    restart: unless-stopped
    # SECRET_KEY, DEBUG=False, ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, POSTGRES_*
    # (pointing at the external DB), and DJANGO_SUPERUSER_* all live here.
    env_file:
      - .env.prod
    # Production WSGI server (not runserver). Entrypoint still runs migrate +
    # collectstatic + superuser bootstrap before this starts.
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 60
      --access-logfile -
    # Bind to loopback only: the reverse proxy on the VPS forwards to it; the app
    # is never exposed to the public internet directly. Point your proxy at
    # 127.0.0.1:8000 (proxy must forward Host and X-Forwarded-Proto).
    ports:
      - "127.0.0.1:8000:8000"
