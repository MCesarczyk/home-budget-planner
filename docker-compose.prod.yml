services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 60
      --access-logfile -
    ports:
      - "${WEB_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      target: runner
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://web:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - web
